<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build your iPhone 18</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f8;--ink:#14171c;--muted:#6a7280;--panel:#ffffff;--line:#dfe3ea;--c:#2f3e55;--accent:#14171c;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--ink:#eef1f5;--muted:#8f98a8;--panel:#171b23;--line:#272d38;--accent:#eef1f5;--onaccent:#0f1218}}
:root[data-theme="dark"]{--bg:#0f1218;--ink:#eef1f5;--muted:#8f98a8;--panel:#171b23;--line:#272d38;--accent:#eef1f5;--onaccent:#0f1218}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--c) 30%,var(--bg)) 0%,color-mix(in srgb,var(--c) 8%,var(--bg)) 62%,var(--bg) 100%);transition:background .6s}
.phone-wrap{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.phone{position:relative;width:224px;height:460px;border-radius:46px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 82%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 85%,#000));
box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 60%,#fff),inset 0 0 0 5px rgba(0,0,0,.18),0 40px 70px -20px rgba(0,0,0,.45),0 12px 24px -12px rgba(0,0,0,.35);transition:background .5s,box-shadow .5s}
.phone i{position:absolute;width:4px;border-radius:3px;background:color-mix(in srgb,var(--c) 70%,#000)}
.phone .b1{left:-4px;top:96px;height:30px}.phone .b2{left:-4px;top:140px;height:52px}.phone .b3{left:-4px;top:202px;height:52px}.phone .b4{right:-4px;top:150px;height:78px}
.cam{position:absolute;top:16px;left:16px;border-radius:24px;background:color-mix(in srgb,var(--c) 78%,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 14px -6px rgba(0,0,0,.4);transition:all .4s,opacity .3s}
.lens{position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3c4660,#0b0d12 62%);box-shadow:0 0 0 4px #1b1f29,0 0 0 5px rgba(255,255,255,.18)}
.lens::after{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7f93c4,#10131b 70%)}
.flash{position:absolute;width:12px;height:12px;border-radius:50%;background:#f4efe0;opacity:.9}
[data-model=base] .cam{width:60px;height:100px;border-radius:30px}
[data-model=base] .l1{left:11px;top:9px}[data-model=base] .l2{left:11px;top:53px}[data-model=base] .l3{display:none}[data-model=base] .flash{left:24px;top:-6px;display:none}
[data-model=pro] .cam,[data-model=max] .cam{width:104px;height:104px}
.l1{left:9px;top:9px}.l2{left:55px;top:9px}.l3{left:32px;top:55px}
[data-model=pro] .flash,[data-model=max] .flash{right:12px;bottom:14px}
.screen{position:absolute;inset:9px;border-radius:38px;background:#05070a;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .4s}
.screen .wall{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),transparent 60%),linear-gradient(170deg,color-mix(in srgb,var(--c) 55%,#000),#05070a)}
.island{position:absolute;top:12px;left:50%;width:62px;height:19px;margin-left:-31px;border-radius:12px;background:#000}
.time{position:absolute;top:74px;width:100%;text-align:center;color:#fff;font-size:62px;font-weight:600;letter-spacing:-.03em}
.date{position:absolute;top:56px;width:100%;text-align:center;color:rgba(255,255,255,.75);font-size:13px;font-weight:500}
.front .screen{opacity:1}.front .cam{opacity:0}
.view{display:inline-flex;padding:4px;border-radius:99px;background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--line)}
.view button{border:0;background:none;padding:6px 18px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.view button[aria-pressed=true]{background:var(--accent);color:var(--onaccent)}
.panel{padding:72px clamp(24px,5vw,72px) 56px;max-width:620px}
h1{margin:0 0 6px;font-size:clamp(30px,4vw,42px);line-height:1.1;letter-spacing:-.03em;font-weight:700}
.sub{margin:0 0 36px;color:var(--muted)}
fieldset{border:0;padding:0;margin:0 0 30px}
legend{padding:0;margin-bottom:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;width:100%}
legend span{font-weight:500;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:15px 18px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);transition:border-color .2s,transform .2s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--ink)}
.opt b{display:block;font-weight:600}.opt small{color:var(--muted);font-size:13.5px}.opt em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opts.row .opt{flex-direction:column;align-items:flex-start;gap:2px}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:0;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.sw[aria-pressed=true]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ink)}
.total{position:sticky;bottom:0;margin:0 -12px;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent);display:flex;align-items:center;justify-content:space-between;gap:16px}
.total p{margin:0;line-height:1.3}.total .n{color:var(--muted);font-size:14px}.total .p{font-size:26px;font-weight:700;letter-spacing:-.02em}
.buy{border:0;background:var(--accent);color:var(--onaccent);padding:15px 30px;border-radius:99px;font-weight:700;font-size:16px;transition:transform .2s}
.buy:active{transform:scale(.97)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
@media (max-width:860px){
.app{grid-template-columns:1fr}
.stage{position:relative;height:auto;padding:48px 0 32px}
.phone-wrap{transform-origin:top center}
.panel{padding-top:32px;max-width:none}
}
.phone{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 42%,color-mix(in srgb,var(--c) 92%,#000));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 72%,#fff),inset 0 0 0 5px rgba(0,0,0,.14),0 40px 70px -20px rgba(0,0,0,.45),0 12px 24px -12px rgba(0,0,0,.35)}
.phone .cam{left:10px;right:10px;top:10px;width:auto;height:112px;border-radius:34px;background:color-mix(in srgb,var(--c) 94%,#000)}
.phone .l1{left:14px;top:12px}.phone .l2{left:14px;top:58px}.phone .l3{left:60px;top:35px}
.phone .flash{right:26px;top:24px;bottom:auto}
.phone .flash::after{content:"";position:absolute;left:0;top:44px;width:12px;height:12px;border-radius:50%;background:#0c0e13}
.specs{margin:-12px 0 30px;padding:18px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.specs p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.specs dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:14.5px}
.specs dt{color:var(--muted)}.specs dd{margin:0;font-weight:500}
.opt[disabled]{opacity:.55;cursor:default}.opt[disabled]:hover{border-color:var(--line)}
.shot{position:relative;width:240px;aspect-ratio:267/543;filter:drop-shadow(0 34px 34px rgba(0,0,0,.32))}
.shot img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .45s}
.shot img.on{opacity:1}
.region{display:inline-flex;gap:10px;align-items:center;margin:-22px 0 30px;color:var(--muted);font-size:14px}
.region select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="stage" aria-label="Preview">
    <div class="phone-wrap" id="wrap"><div class="shot" id="shot"></div></div>
  </section>

  <section class="panel">
    <h1>Build your iPhone 18</h1>
    <p class="sub">Choose a model, finish and storage. The preview updates as you go.</p>
    <label class="region">Prices for <select id="region"><option value="US">United States (USD)</option><option value="BR">Brasil (BRL)</option><option value="EU">Europe, euro (EUR)</option></select></label>

    <fieldset><legend>Model</legend><div class="opts" id="models"></div></fieldset>
    <div class="specs" id="specs"></div>
    <fieldset><legend>Finish <span id="colorName"></span></legend><div class="swatches" id="colors"></div></fieldset>
    <fieldset><legend>Storage</legend><div class="opts row" id="storage"></div></fieldset>

    <div class="total">
      <p><span class="n" id="sumName"></span><br><span class="p" id="sumPrice"></span></p>
      <button class="buy" id="buy">Add to bag</button>
    </div>
    <p class="note" id="status" role="status" aria-live="polite"></p>
    <p class="note" id="priceNote"></p>
    <p class="note">Unofficial configurator, not affiliated with Apple. Phone previews come from your supplied photo; Silver and Black are recoloured from it.</p>
  </section>
</main>

const STORAGE=[256,512,1024,2048];
const MODELS={
  pro:{name:'iPhone 18 Pro',blurb:'The compact Pro with a 48MP triple camera',scale:1,colors:COLORS,
    desc:'The compact Pro. It has the same A20 Pro chip and 48MP triple camera as the Max, in a 6.3″ body.',
    specs:[['Display','6.3″ Super Retina XDR OLED, 120Hz ProMotion'],['Resolution','2622 × 1206, 460 ppi'],['Chip','A20 Pro, 2nm'],['Rear cameras','48MP Pro Fusion: main, ultra wide, telephoto'],['Front camera','18MP Center Stage'],['Battery','Up to 34 hours of video playback'],['Weight','7.4 oz']]},
  max:{name:'iPhone 18 Pro Max',blurb:'The largest display and longest battery',scale:1.08,colors:COLORS,
    desc:'The biggest 18. A 6.9″ display and the longest battery life on a Pro iPhone, with the same A20 Pro chip and cameras.',
    specs:[['Display','6.9″ Super Retina XDR OLED, 120Hz ProMotion'],['Resolution','2868 × 1320'],['Chip','A20 Pro, 2nm'],['Rear cameras','48MP Pro Fusion: main, ultra wide, telephoto'],['Front camera','18MP Center Stage'],['Battery','Up to 43 hours of video playback'],['Weight','8.8 oz']]}
};
const label=g=>g>=1024?(g/1024)+'TB':g+'GB';
const nf=(l,c)=>new Intl.NumberFormat(l,{style:'currency',currency:c,maximumFractionDigits:0});
const PRICES={
  US:{fmt:nf('en-US','USD'),p:{pro:{256:1199,512:1399,1024:1799,2048:2399},max:{256:1299,512:1499,1024:1899,2048:2499}},note:'US launch prices. The Pro 2TB price is estimated.'},
  BR:{fmt:nf('pt-BR','BRL'),p:{pro:{256:11999,512:13499,1024:16499,2048:20999},max:{256:12999,512:14499,1024:17499,2048:21999}},note:'Brazil launch prices, taken from press reports of Apple’s price list.'},
  EU:{fmt:nf('de-DE','EUR'),p:{pro:{256:1449,512:1699,1024:2199,2048:2949},max:{256:1599,512:1849,1024:2349,2048:3099}},note:'Euro prices from a European retailer’s launch list. Other euro countries vary slightly.'}
};
let fallback=false;
function detect(){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  if(/^America\/(Sao_Paulo|Bahia|Fortaleza|Recife|Manaus|Belem|Cuiaba|Campo_Grande|Araguaina|Maceio|Noronha|Porto_Velho|Rio_Branco|Boa_Vista|Santarem|Eirunepe)$/.test(tz))return 'BR';
  if(/^Europe\/(Berlin|Amsterdam|Paris|Rome|Madrid|Lisbon|Vienna|Brussels|Dublin|Helsinki|Athens|Luxembourg|Malta|Tallinn|Riga|Vilnius|Bratislava|Ljubljana|Zagreb)$/.test(tz))return 'EU';
  if(/^(America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise|Indiana\/.*|Kentucky\/.*)|Pacific\/Honolulu)$/.test(tz))return 'US';
  for(const l of (navigator.languages||[navigator.language||''])){
    const m=/[-_]([A-Za-z]{2})$/.exec(l);if(!m)continue;const c=m[1].toUpperCase();
    if(c==='BR'||c==='US')return c;
    if('DE FR IT ES NL BE AT IE PT FI GR LU MT EE LV LT SK SI HR'.split(' ').includes(c))return 'EU';
  }
  fallback=true;return 'US';
}
let reg=detect();let R=PRICES[reg];
const money=n=>R.fmt.format(n);
const s={model:'pro',color:0,storage:256};
const $=id=>document.getElementById(id);
const root=document.documentElement;
$('shot').innerHTML=COLORS.map(([n])=>`<img data-n="${n}" src="${IMG[n]}" alt="iPhone 18 Pro in ${n}">`).join('');

function render(){
  const m={...MODELS[s.model],prices:R.p[s.model]};
  if(s.color>=m.colors.length)s.color=0;
  const [cn,hex]=m.colors[s.color];
  root.style.setProperty('--c',hex);
  document.querySelectorAll('#shot img').forEach(i=>i.classList.toggle('on',i.dataset.n===cn));
  $('wrap').style.transform='scale('+m.scale+')';
  $('colorName').textContent=cn;
  $('region').value=reg;
  $('priceNote').textContent=R.note+(fallback&&reg==='US'?' Your region isn’t listed yet, so US prices are shown.':'');

  $('models').innerHTML=Object.entries(MODELS).map(([k,v])=>
    `<button class="opt" data-k="${k}" aria-pressed="${k===s.model}"><span><b>${v.name}</b><small>${v.blurb}</small></span><em>From ${money(R.p[k][256])}</em></button>`).join('')+'<button class="opt" disabled><span><b>iPhone 18</b><small>Standard model, expected spring 2027</small></span><em>Not yet</em></button>';
  $('colors').innerHTML=m.colors.map(([n,h],i)=>
    `<button class="sw" style="--s:${h}" data-i="${i}" aria-label="${n}" aria-pressed="${i===s.color}"></button>`).join('');
  $('storage').innerHTML=STORAGE.map(g=>
    `<button class="opt" data-g="${g}" aria-pressed="${g===s.storage}"><b>${label(g)}</b><em>${g===256?'Included':'+'+money(m.prices[g]-m.prices[256])}</em></button>`).join('');

  $('sumName').textContent=`${m.name} · ${cn} · ${label(s.storage)}`;
  $('sumPrice').textContent=money(m.prices[s.storage]);
  $('specs').innerHTML='<p>'+m.desc+'</p><dl>'+m.specs.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';
  $('status').textContent='';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const f=document.activeElement===t;
  if(t.dataset.k){s.model=t.dataset.k;render();focusBack('[data-k="'+s.model+'"]',f)}
  else if(t.dataset.i){s.color=+t.dataset.i;render();focusBack('[data-i="'+s.color+'"]',f)}
  else if(t.dataset.g){s.storage=+t.dataset.g;render();focusBack('[data-g="'+s.storage+'"]',f)}
});
function focusBack(sel,had){if(had){const el=document.querySelector(sel);el&&el.focus()}}
$('buy').onclick=()=>{$('status').textContent='Added to bag: '+$('sumName').textContent+' — '+$('sumPrice').textContent};
$('region').addEventListener('change',e=>{reg=e.target.value;fallback=false;R=PRICES[reg];render()});
render();
</script>
</body>
</html>
